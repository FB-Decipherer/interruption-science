<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img"
     aria-label="A timeline of one interruption: working on the main task, an alert, the interruption lag, the interruption, the resumption lag, and back to the main task." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:Georgia,serif;font-size:19px;fill:#2B2722}
    .s{font-family:Georgia,serif;font-size:15px;fill:#55504A}
    .b{font-family:Georgia,serif;font-size:16px;font-weight:bold;fill:#FFFDFA}
    @media (prefers-color-scheme:dark){ .t{fill:#EDE7DD} .s{fill:#ADA599} }
  </style>
  <text x="340" y="48" text-anchor="middle" class="t">One interruption, as researchers time it</text>
  <line x1="30" y1="230" x2="650" y2="230" stroke="#8A8378" stroke-width="2"/>
  <rect x="30"  y="190" width="170" height="80" rx="6" fill="#4C7A4E"/>
  <text x="115" y="236" text-anchor="middle" class="b">main task</text>
  <rect x="200" y="190" width="70"  height="80" fill="#C8992F"/>
  <rect x="270" y="190" width="170" height="80" fill="#B4372C"/>
  <text x="355" y="236" text-anchor="middle" class="b">interruption</text>
  <rect x="440" y="190" width="70"  height="80" fill="#C8992F"/>
  <rect x="510" y="190" width="140" height="80" rx="6" fill="#4C7A4E"/>
  <text x="580" y="236" text-anchor="middle" class="b">main task</text>
  <path d="M200 120 V182" stroke="#2B2722" stroke-width="2.5"/><circle cx="200" cy="114" r="7" fill="#C8992F" stroke="#2B2722" stroke-width="2"/>
  <text x="200" y="96" text-anchor="middle" class="t">alert</text>
  <path d="M200 300 H270" stroke="#8A6516" stroke-width="2.5"/><path d="M200 292 V308 M270 292 V308" stroke="#8A6516" stroke-width="2.5"/>
  <text x="235" y="332" text-anchor="middle" class="t">interruption</text><text x="235" y="354" text-anchor="middle" class="t">lag</text>
  <text x="235" y="378" text-anchor="middle" class="s">time to prepare</text>
  <path d="M440 300 H510" stroke="#8A6516" stroke-width="2.5"/><path d="M440 292 V308 M510 292 V308" stroke="#8A6516" stroke-width="2.5"/>
  <text x="475" y="332" text-anchor="middle" class="t">resumption</text><text x="475" y="354" text-anchor="middle" class="t">lag</text>
  <text x="475" y="378" text-anchor="middle" class="s">time to get back</text>
  <text x="340" y="420" text-anchor="middle" class="s">After Trafton, Altmann, Brock and Mintz (2003)</text>
</svg>
